[project]
name = "zephyrus-shell"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# Workers adjust sys.path before importing project modules when run directly.
ignore = ["E402"]

[tool.ty.src]
# unittest fixtures monkey-patch runtime dependencies; check shipped Python here.
exclude = ["tests"]
