general {
    lock_cmd = pgrep -x hyprlock >/dev/null || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl eval 'zephyrus.wake_displays()'
    ignore_systemd_inhibit = false
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl eval 'zephyrus.wake_displays()'
}

listener {
    timeout = 1800
    on-timeout = systemctl --check-inhibitors=yes suspend
}
