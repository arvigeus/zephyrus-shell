general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    color = rgba(101115ff)
    path = $ZEPHYRUS_LOCK_WALLPAPER
    blur_passes = 0
}

input-field {
    monitor =
    size = 280, 48
    position = 0, -40
    halign = center
    valign = center
    outline_thickness = 2
    rounding = 16
    outer_color = rgba(ff465cff)
    inner_color = rgba(191b21ff)
    font_color = rgba(f1f2f6ff)
    fail_color = rgba(ff8090ff)
    check_color = rgba(ff465cff)
    placeholder_text = Password
}
